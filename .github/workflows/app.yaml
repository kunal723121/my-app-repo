name: App CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: my-cluster

  BACKEND_IMAGE: kunal723121/ecombackend
  FRONTEND_IMAGE: kunal723121/ecomfrontend

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build backend
      - name: Build backend image
        run: |
          docker build \
            -t $BACKEND_IMAGE:${GITHUB_SHA} \
            ./backend

      # 4. Push backend
      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:${GITHUB_SHA}

      # 5. Build frontend
      - name: Build frontend image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:${GITHUB_SHA} \
            ./frontend

      # 6. Push frontend
      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:${GITHUB_SHA}

      # 7. Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 8. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 9. Deploy Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      # 10. Update backend image
      - name: Update backend image
        run: |
          kubectl set image deployment/backend \
            backend=$BACKEND_IMAGE:${GITHUB_SHA}

      # 11. Update frontend image
      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_IMAGE:${GITHUB_SHA}

      # 12. Wait for rollout
      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend
