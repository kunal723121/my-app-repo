apiVersion: apps/v1
kind: Development
metadata:
  name: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchlabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        secret.reloader.stakater.com/reload: "backend-secret"
    spec:
      containers:
        name: backend
        image: kunal723121/ecombackend:latest
        ports:
          - containerPort: 5000
        envFrom:
          secretRef:
            name: backend-secret     
